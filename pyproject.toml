[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-claim-agent"
version = "1.0.0"
description = "Insurance Claim Verification OpenEnv Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "requests>=2.31.0",
    "openai>=1.34.0",
    "gymnasium>=0.29.1",
    "stable-baselines3[extra]>=2.3.2",
    "redis>=5.0.0",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "server*"]
